name: Create release

on:
  create

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/decap-cms@')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get semver number
        id: get_semver
        env:
          TAG_NAME: ${{ github.ref }}
        run: echo "pkg=${TAG_NAME:10}" >> "$GITHUB_OUTPUT"

      - name: Create release on GitHub API
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ steps.get_semver.outputs.pkg }}
          body: |
            :scroll: [Changelog](https://github.com/${{ github.repository }}/blob/${{ steps.get_semver.outputs.pkg }}/CHANGELOG.md)
          draft: false
          prerelease: false
